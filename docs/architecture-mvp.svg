<text x="45" y="743" font-size="17" font-weight="bold">Observed local loop</text>
<text x="45" y="775" font-size="15">Synthetic event → evidence → situation → evaluate → invalidate → new plan → offline degradation → reconcile</text>
<text x="45" y="811" font-size="13">Solid blocks: shipped boundaries. Dashed blocks: external services or future work; status is labeled. Synthetic replay never proves real route safety.</text>
</g></svg>
