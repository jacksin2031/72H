# Submit only after ADC, enabled APIs, IAM and budget controls have been checked.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'infra/cloud-run/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/72h:${_RELEASE}', '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/72h:${_RELEASE}'
substitutions:
  _REGION: asia-northeast1
  _REPOSITORY: 72h
  _RELEASE: local-review
options:
  logging: CLOUD_LOGGING_ONLY
