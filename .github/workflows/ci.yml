name: Validate 72H
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.12'
          python-version: '3.11'
      - run: uv sync --project services/agent-api --frozen
      - run: uv run --project services/agent-api pytest services/agent-api/tests
      - run: uv run --project services/agent-api python scripts/check_secrets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web --no-audit --no-fund
      - run: npm test --prefix apps/web
      - run: npm run typecheck --prefix apps/web
      - run: npm run build --prefix apps/web
