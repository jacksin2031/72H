[project]
name = "72h-contracts"
version = "0.1.0"
description = "Canonical typed domain contracts for 72H"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.12,<3.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seventytwoh_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"seventytwoh_contracts/data/japan-areas.json" = "seventytwoh_contracts/data/japan-areas.json"
